name: Aside
description: >-
  Aside is an AI-powered browser from a Y Combinator (Fall 2025) startup that runs an
  autonomous browser agent to complete real work across the logged-in websites you already
  use — email, dashboards, internal tools, documents, and spreadsheets — without relying on
  per-service API integrations. It pairs browsing history used as local memory with the first
  password manager designed for AI agents (hardware-backed encryption, audit logging), keeps
  data local-first and end-to-end encrypted, and gates sensitive actions like payments and
  messages behind human approval. For developers, Aside ships a command-line interface, a
  Model Context Protocol (MCP) server, and a browser-automation REPL so other agents and
  coding tools can drive the browser, plus bring-your-own-key support for OpenAI and Anthropic
  models.
